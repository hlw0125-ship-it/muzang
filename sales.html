<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>沐藏 銷售紀錄</title>
<style>
:root{--bg:#f6f2ea;--card:#fff;--ink:#2a2420;--mute:#7a6f64;--acc:#8a3b2a;--line:#e3dccf}
@media(prefers-color-scheme:dark){:root{--bg:#1c1816;--card:#26211e;--ink:#f1e9de;--mute:#a89c8f;--acc:#e0866f;--line:#3a332e}}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"PingFang TC",sans-serif;max-width:820px;margin:0 auto;padding:14px;background:var(--bg);color:var(--ink)}
h1{font-size:20px;margin:4px 0 6px}a{color:var(--acc);font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
input,select{padding:10px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);flex:1;min-width:0;min-height:46px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;line-height:1.7;font-size:15px}
.m{color:var(--mute);font-size:14px}.big{font-size:26px;font-weight:700;color:var(--acc)}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
button{padding:10px 14px;border:1px solid var(--acc);background:none;color:var(--acc);border-radius:8px;font-size:15px}
button.p{background:var(--acc);color:#fff}
</style></head><body>
<h1>沐藏料理所 銷售紀錄</h1>
<div style="margin-bottom:8px"><a href="/admin">← 訂位後台</a></div>
<div class="m">日期範圍（起 ～ 迄）</div>
<div class="bar"><input type="date" id="fd"><input type="date" id="ft"></div>
<div class="bar"><select id="fp"><option value="">全部付款方式</option><option>現金</option><option>信用卡</option><option>LINE Pay</option><option>轉帳</option></select><input id="fq" placeholder="搜尋品項、備註（如酒款）"></div>
<div class="bar"><button class="p" id="go">查詢</button><button id="exp">匯出 CSV</button><button id="mon">本月</button><button id="tod">今天</button></div>
<div class="c" id="stat"></div>
<div class="c" id="bypay"></div>
<div class="c" id="byday"></div>
<div id="l"></div>
<script>
var all=[],$=function(i){return document.getElementById(i)};
function tw(){return new Date(Date.now()+288e5).toISOString().slice(0,10)}
function M(n){return "$"+Number(n||0).toLocaleString()}
function T(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function load(){
  var f=$("fd").value||tw(),t=$("ft").value||f;
  fetch("/api/pos/sales?from="+f+"&to="+t).then(function(r){return r.json()}).then(function(d){all=d;draw()}).catch(function(){$("stat").textContent="讀取失敗，請稍後再試"})}
function rows(){var p=$("fp").value,q=$("fq").value.trim().toLowerCase();
  return all.filter(function(x){return(!p||x.pay===p)&&(!q||x.items.map(function(i){return i.n}).join(" ").toLowerCase().indexOf(q)>=0)})}
function sum(a,k){return a.reduce(function(s,x){return s+(x[k]||0)},0)}
function draw(){
  var r=rows();
  var st=$("stat");st.innerHTML="";
  st.append(T("div","共 "+r.length+" 筆","m"),T("div",M(sum(r,"total")),"big"));
  [["小計",sum(r,"sub")],["服務費",sum(r,"svc")],["9 折折扣",sum(r,"d9")],["優惠券",sum(r,"cp")],["闆娘招待",sum(r,"bs")]].forEach(function(p){
    var d=T("div",null,"row");d.append(T("span",p[0]),T("span",(p[1]<0?"-":"")+M(Math.abs(p[1]))));st.append(d)});
  var bp=$("bypay");bp.innerHTML="";bp.append(T("b","各付款方式"));
  var pm={};r.forEach(function(x){pm[x.pay]=pm[x.pay]||{n:0,t:0};pm[x.pay].n++;pm[x.pay].t+=x.total});
  Object.keys(pm).forEach(function(k){var d=T("div",null,"row");d.append(T("span",k+"（"+pm[k].n+" 筆）"),T("span",M(pm[k].t)));bp.append(d)});
  var bd=$("byday");bd.innerHTML="";bd.append(T("b","每日營收"));
  var dm={};r.forEach(function(x){dm[x.date]=dm[x.date]||{n:0,t:0};dm[x.date].n++;dm[x.date].t+=x.total});
  Object.keys(dm).sort().reverse().forEach(function(k){var d=T("div",null,"row");d.append(T("span",k+"（"+dm[k].n+" 筆）"),T("span",M(dm[k].t)));bd.append(d)});
  var l=$("l");l.innerHTML="";
  r.forEach(function(x){
    var c=T("div",null,"c");
    var h=T("div");h.append(T("b",x.date+" "+x.time+"　"+x.pay+"　"+M(x.total)));c.append(h);
    c.append(T("div",x.items.map(function(i){return i.n+" × "+i.q+"（"+M(i.p)+"）"}).join("；"),"m"));
    var adj=[x.svc&&"服務費 "+M(x.svc),x.d9&&"9折 -"+M(-x.d9),x.cp&&"優惠券 -"+M(-x.cp),x.bs&&"招待 -"+M(-x.bs)].filter(Boolean).join("｜");
    if(adj)c.append(T("div",adj,"m"));
    var b=T("button","刪除");b.style.cssText="margin-top:6px;color:#c0392b;border-color:#c0392b";
    b.onclick=function(){if(!confirm("確定要永久刪除這筆銷售嗎？\n"+x.date+" "+x.time+"　"+M(x.total)+"\n刪除後無法復原。"))return;
      fetch("/api/pos/sales/"+x.id,{method:"DELETE"}).then(load)};
    c.append(b);l.append(c)});
  if(!r.length)l.textContent="沒有符合的銷售紀錄"}
function csv(){
  var q=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'};
  var o=["日期,時間,付款,品項,小計,服務費,9折,優惠券,招待,應收"];
  rows().forEach(function(x){o.push([x.date,x.time,x.pay,x.items.map(function(i){return i.n+"x"+i.q+"@"+i.p}).join(" / "),x.sub,x.svc,x.d9,x.cp,x.bs,x.total].map(q).join(","))});
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+o.join("\n")],{type:"text/csv;charset=utf-8"}));a.download="muzang-sales-"+tw()+".csv";a.click()}
$("go").onclick=load;$("exp").onclick=csv;$("fp").onchange=draw;$("fq").oninput=draw;
$("tod").onclick=function(){$("fd").value=tw();$("ft").value=tw();load()};
$("mon").onclick=function(){$("fd").value=tw().slice(0,8)+"01";$("ft").value=tw();load()};
$("fd").value=tw();$("ft").value=tw();load();
</script></body></html>
