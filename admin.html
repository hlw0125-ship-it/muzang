<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>沐藏 訂位後台</title>
<style>
:root{--bg:#f6f2ea;--card:#fff;--ink:#2a2420;--mute:#7a6f64;--acc:#8a3b2a;--line:#e3dccf}
@media(prefers-color-scheme:dark){:root{--bg:#1c1816;--card:#26211e;--ink:#f1e9de;--mute:#a89c8f;--acc:#e0866f;--line:#3a332e}}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"PingFang TC",sans-serif;max-width:820px;margin:0 auto;padding:14px;background:var(--bg);color:var(--ink)}
h1{font-size:20px;margin:4px 0 10px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select,textarea{padding:10px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.bar input,.bar select{width:auto;flex:1;min-width:130px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;line-height:1.7;font-size:15px}
.s{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;color:#fff;margin-left:6px}
.paid{background:#06a050}.pending{background:#c98a00}.inquiry{background:#3b6fb6}.cancelled,.failed{background:#999}
.m{color:var(--mute);font-size:14px}
button{padding:10px 14px;border:1px solid var(--acc);background:none;color:var(--acc);border-radius:8px;font-size:15px}
button.p{background:var(--acc);color:#fff}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);width:min(94vw,480px);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
.r2{display:flex;gap:8px}.r2>div{flex:1}
</style></head><body>
<h1>沐藏料理所 訂位後台</h1>
<div class="bar">
  <input type="date" id="fd"><select id="fs"><option value="">全部狀態</option><option value="paid">已付訂金</option><option value="pending">待付訂金</option><option value="inquiry">洽詢中</option><option value="cancelled">已取消</option></select>
  <button class="p" id="add">＋ 新增訂位</button>
</div>
<div class="sum" id="sum"></div>
<div id="l"></div>

<dialog id="dlg"><form method="dialog" id="fm" onsubmit="return false">
<b id="dt">訂位</b>
<label>訂位人</label><input id="f_name">
<label>聯絡電話</label><input id="f_phone" type="tel">
<div class="r2"><div><label>日期</label><input id="f_date" type="date"></div><div><label>時間</label><input id="f_time" type="time"></div></div>
<div class="r2"><div><label>人數</label><input id="f_people" type="number" min="1"></div><div><label>價格（NT$，未含 10% 服務費）</label><input id="f_price" type="number" min="0"></div></div>
<label>套餐</label><input id="f_pkg" placeholder="例：$1,880｜山海旬味・經典懷石">
<label>備註（忌口、目的、其他）</label><textarea id="f_note" rows="3"></textarea>
<div class="r2"><div><label>訂金狀態</label><select id="f_status"><option value="inquiry">洽詢中</option><option value="pending">待付訂金</option><option value="paid">已付訂金</option><option value="cancelled">已取消</option></select></div><div><label>訂金支付日期</label><input id="f_paid" type="date"></div></div>
<div class="r2"><div><label>接洽服務人員</label><input id="f_handler"></div><div><label>接洽日期</label><input id="f_cdate" type="date"></div></div>
<label>接洽來源</label><input id="f_source" list="src" placeholder="例：官方LINE、電話、現場"><datalist id="src"><option>官方LINE</option><option>電話</option><option>網站訂位</option><option>現場</option><option>Ocard</option><option>其他</option></datalist>
<div style="display:flex;gap:8px;margin-top:14px"><button class="p" id="ok" style="flex:1">儲存</button><button id="cx" style="flex:1">取消</button></div>
</form></dialog>

<script>
var all=[],cur=null,$=function(i){return document.getElementById(i)};
var ST={paid:"已付訂金",pending:"待付訂金",inquiry:"洽詢中",cancelled:"已取消",failed:"付款失敗"};
function holds(x){return x.status==="paid"||(x.status==="pending"&&(x.manual||Date.now()-new Date(x.created)<9e5))}
function load(){fetch("/api/admin/reservations").then(function(r){return r.json()}).then(function(d){all=d;draw();slots()})}
function slots(){var d=$("fd").value,s=$("sum");s.innerHTML="";if(!d)return;
  fetch("/api/slots?date="+d).then(function(r){return r.json()}).then(function(j){
    if(!j.slots.length){s.textContent="當日不在固定開放時段（週一、週二）";return}
    j.slots.forEach(function(x){var e=document.createElement("div");e.textContent=x.time+" 剩 "+x.remaining+" / "+j.cap+" 位";s.append(e)})})}
function T(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function draw(){
  var fd=$("fd").value,fs=$("fs").value,l=$("l");l.innerHTML="";
  var rows=all.filter(function(x){return(!fd||x.date===fd)&&(!fs||x.status===fs)}).sort(function(a,b){return(a.date+a.time)<(b.date+b.time)?-1:1});
  if(!rows.length){l.textContent="沒有資料";return}
  rows.forEach(function(x){
    var d=T("div",null,"c"),h=T("div");
    h.append(T("b",x.date+" "+x.time+"　"+x.name+"　"+x.people+"位"),T("span",ST[x.status]||x.status,"s "+x.status));d.append(h);
    d.append(T("div","電話："+x.phone+"　價格：$"+Number(x.price||0).toLocaleString()+(x.pkg?"（"+x.pkg+"）":"")));
    d.append(T("div","訂金："+(x.status==="paid"?"已支付"+(x.paidAt?"（"+x.paidAt.slice(0,10)+"）":""):"未支付")+"　$"+(x.people*1000).toLocaleString()));
    var nt=[x.allergy&&"忌口："+x.allergy,x.purpose&&"目的："+x.purpose,x.note&&"備註："+x.note].filter(Boolean).join("｜");
    if(nt)d.append(T("div",nt,"m"));
    d.append(T("div","接洽："+(x.handler||"—")+"｜"+(x.contactDate||"—")+"｜來源："+(x.source||"—"),"m"));
    var b=T("button","編輯");b.onclick=function(){open_(x)};b.style.marginTop="6px";d.append(b);l.append(d)})}
function open_(x){cur=x;$("dt").textContent=x?"編輯訂位":"新增訂位";
  var v=x||{status:"pending",contactDate:new Date(Date.now()+288e5).toISOString().slice(0,10),people:2};
  $("f_name").value=v.name||"";$("f_phone").value=v.phone||"";$("f_date").value=v.date||"";$("f_time").value=v.time||"";
  $("f_people").value=v.people||"";$("f_price").value=v.price||"";$("f_pkg").value=v.pkg||"";
  $("f_note").value=[v.allergy&&"忌口："+v.allergy,v.purpose&&"目的："+v.purpose,v.note].filter(Boolean).join("；");
  $("f_status").value=v.status==="failed"?"cancelled":v.status;$("f_paid").value=(v.paidAt||"").slice(0,10);
  $("f_handler").value=v.handler||"";$("f_cdate").value=v.contactDate||"";$("f_source").value=v.source||"";$("dlg").showModal()}
function body(force){return{name:$("f_name").value.trim(),phone:$("f_phone").value.trim(),date:$("f_date").value,time:$("f_time").value,
  people:$("f_people").value,price:$("f_price").value,pkg:$("f_pkg").value,note:$("f_note").value,allergy:cur?"":"",purpose:cur?"":"",
  status:$("f_status").value,paidAt:$("f_paid").value,handler:$("f_handler").value,contactDate:$("f_cdate").value,source:$("f_source").value,force:!!force}}
function send(force){
  var b=body(force);if(cur){b.allergy="";b.purpose=""}
  fetch(cur?"/api/admin/reservations/"+cur.id:"/api/admin/reservations",{method:cur?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})
  .then(function(r){return r.json().then(function(j){return[r.status,j]})}).then(function(p){
    if(p[0]===409){if(confirm(p[1].error))send(true);return}
    if(p[0]!==200){alert(p[1].error||"儲存失敗");return}
    $("dlg").close();load()})}
$("ok").onclick=function(){send(false)};$("cx").onclick=function(){$("dlg").close()};
$("add").onclick=function(){open_(null)};
$("fd").onchange=function(){draw();slots()};$("fs").onchange=draw;
load();setInterval(load,30000);
</script></body></html>
